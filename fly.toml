# Caper CostWise — Fly.io configuration
#
# NOTE: `app` must be globally unique across all of Fly. If "otg-fieldcost" is
# taken, change it (e.g. add your initials) OR just run `fly launch` and let it
# pick a name — it will rewrite this line for you.
app = "breadapp"

# Pick a region close to your users. `fly platform regions` lists all of them.
# iad = Ashburn, Virginia (US East). sjc = San Jose (US West).
primary_region = "lax"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"
  # Fly terminates TLS at the edge and forwards over http with
  # x-forwarded-proto. This makes Express trust that header so req.secure is
  # correct and the app sends HSTS (see server.js).
  TRUST_PROXY = "1"

# Persistent disk. Everything the app must keep — the SQLite database
# (data/otg.db) AND uploaded receipts/PDFs (data/receipts/) — lives here and
# survives deploys, restarts, and machine sleep.
# Create it once with:  fly volume create otg_data --size 5 --region lax
# (5 GB gives headroom for vendor PDFs at 20-25 users; resize with
#  fly volume extend <vol-id> --size <gb> if it fills up)
[mounts]
  source = "otg_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Always-on for 20-25 active users — no cold-start delay on first request.
  # Drop back to auto_stop_machines = "stop" / min_machines_running = 0 if
  # the app goes idle for extended periods and cost matters more than latency.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

# Single machine — SQLite is single-writer so never scale count above 1.
# performance-1x: 1 dedicated CPU + 2 GB RAM.
# Handles 20-25 concurrent users comfortably; WAL mode in db.js gives
# parallel reads so only writes ever queue. (~$31/mo vs $2 shared-cpu-1x)
[[vm]]
  size = "performance-1x"
  memory = "2048mb"
  cpus = 1

# With a single volume-backed machine, replace the machine in place on deploy
# rather than trying to spin up a second one (which can't attach the volume).
[deploy]
  strategy = "immediate"
